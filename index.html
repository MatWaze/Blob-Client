<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blobula</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <div class="title">BLOBULA</div>
        <div class="nav-buttons">
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider">
                        <span class="icon">🌙</span>
                        <span class="icon">☀️</span>
                    </div>
                </label>
            </div>
            <button class="nav-btn" id="loginBtn">Login</button>
            <button class="nav-btn" id="registerBtn">Register</button>
            <button class="nav-btn" id="gameBtn" disabled>Pong</button>
            <button class="nav-btn" id="profileBtn" disabled>Profile</button>
            <button class="nav-btn" id="logoutBtn" style="display: none;">Logout</button>
        </div>
    </div>

    <div class="main-content">
        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-title">BLOBULA</div>
            <div class="welcome-subtitle">Choose an option to get started</div>
            <div class="welcome-buttons">
                <button class="welcome-btn" id="welcomeLoginBtn">Login</button>
                <button class="welcome-btn" id="welcomeRegisterBtn">Register</button>
                <button class="welcome-btn" id="welcomeGameBtn" disabled>Play Game</button>
                <button class="welcome-btn" id="welcomeProfileBtn" disabled>Profile</button>
            </div>
        </div>

        <!-- Login Window -->
        <div class="window" id="loginWindow">
            <div class="window-header">
                <div class="window-title">🔐 Login</div>
                <div class="window-controls">
                    <div class="window-control maximize" title="Maximize" onclick="client.toggleMaximize('login')"></div>
                    <div class="window-control close" title="Close" onclick="client.hideWindow('login')"></div>
                </div>
            </div>
            <div class="window-content">
                <iframe id="loginFrame" src=""></iframe>
            </div>
            <div class="resize-handle"></div>
        </div>

        <!-- Register Window -->
        <div class="window" id="registerWindow">
            <div class="window-header">
                <div class="window-title">📝 Register</div>
                <div class="window-controls">
                    <div class="window-control maximize" title="Maximize" onclick="client.toggleMaximize('register')"></div>
                    <div class="window-control close" title="Close" onclick="client.hideWindow('register')"></div>
                </div>
            </div>
            <div class="window-content">
                <iframe id="registerFrame" src=""></iframe>
            </div>
            <div class="resize-handle"></div>
        </div>

        <!-- Game Window -->
        <div class="window" id="gameWindow">
            <div class="window-header">
                <div class="window-title">🎮 Game</div>
                <div class="window-controls">
                    <div class="window-control maximize" title="Maximize" onclick="client.toggleMaximize('game')"></div>
                    <div class="window-control close" title="Close" onclick="client.hideWindow('game')"></div>
                </div>
            </div>
            <div class="window-content">
                <iframe id="gameFrame" src=""></iframe>
            </div>
            <div class="resize-handle"></div>
        </div>

        <!-- Profile Window -->
        <div class="window" id="profileWindow">
            <div class="window-header">
                <div class="window-title">👤 Profile</div>
                <div class="window-controls">
                    <div class="window-control maximize" title="Maximize" onclick="client.toggleMaximize('profile')"></div>
                    <div class="window-control close" title="Close" onclick="client.hideWindow('profile')"></div>
                </div>
            </div>
            <div class="window-content">
                <div id="profileContent" style="padding: 20px; color: var(--text-primary); font-family: 'Courier New', monospace; max-width: 800px; margin: 0 auto; overflow-y: auto; height: 100%;">
                    <h2 style="border-bottom: 2px solid var(--border-primary); padding-bottom: 10px; margin-bottom: 20px; color: var(--text-primary);">User Profile</h2>
                    
                    <!-- Profile Tabs -->
                    <div class="profile-tabs">
                        <button class="profile-tab active" onclick="client.switchProfileTab('info')">User Information</button>
                        <button class="profile-tab" onclick="client.switchProfileTab('transactions')">Transactions</button>
                        <button class="profile-tab" onclick="client.switchProfileTab('games')">Recent Games</button>
                    </div>

                    <!-- User Information Section -->
                    <div id="profileSectionInfo" class="profile-section active">
                        <div style="display: flex; flex-direction: column; gap: 20px;">
                            <div class="profile-field">
                                <label style="display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 5px;">USERNAME</label>
                                <div id="profileUsername" style="font-size: 16px; padding: 8px 12px; background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: 4px; color: var(--text-primary);">Not logged in</div>
                            </div>
                            <div class="profile-field">
                                <label style="display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 5px;">EMAIL</label>
                                <div id="profileEmail" style="font-size: 16px; padding: 8px 12px; background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: 4px; color: var(--text-primary);">Not logged in</div>
                            </div>
                            <div class="profile-field">
                                <label style="display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 5px;">BALANCE</label>
                                <div id="profileBalance" style="font-size: 16px; padding: 8px 12px; background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: 4px; color: var(--text-primary);">0.00</div>
                            </div>
                            <div class="profile-field">
                                <label style="display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 5px;">WALLET ADDRESS</label>
                                <div style="display: flex; gap: 10px; align-items: stretch;">
                                    <input type="text" id="profileWalletInput" placeholder="Enter wallet address" style="flex: 1; font-size: 14px; padding: 8px 12px; background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: 4px; color: var(--text-primary); font-family: 'Courier New', monospace;">
                                    <button id="updateWalletBtn" style="background: var(--bg-tertiary); border: 2px solid var(--border-primary); color: var(--text-primary); padding: 8px 20px; border-radius: 4px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 14px; transition: all 0.3s ease; white-space: nowrap;">Update</button>
                                </div>
                                <div id="profileWallet" style="font-size: 12px; padding: 8px 0; color: var(--text-secondary); word-break: break-all;">Not available</div>
                            </div>
                        </div>
                    </div>

                    <!-- Transactions Section -->
                    <div id="profileSectionTransactions" class="profile-section">
                        <div id="transactionsContainer">
                            <div class="loading-state">
                                <div class="loading-spinner-small"></div>
                                <p>Loading transactions...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Games Section -->
                    <div id="profileSectionGames" class="profile-section">
                        <div id="gamesContainer">
                            <div class="loading-state">
                                <div class="loading-spinner-small"></div>
                                <p>Loading games...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="resize-handle"></div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading hidden" id="loading">
        <div class="loading-spinner"></div>
        <h3>Loading...</h3>
        <p id="loadingMessage">Initializing application...</p>
    </div>
    <script type="module" src="/client.ts"></script>
</body>
</html>
