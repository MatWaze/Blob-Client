<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { 
        font-family: 'Courier New', monospace; 
        max-width: 400px; 
        margin: 50px auto !important; 
        background: var(--bg-primary);
        color: var(--text-primary);
        padding: 20px;
        height: auto !important;
        overflow: auto !important;
        transition: background 0.3s ease, color 0.3s ease;
    }
    label { display: block; margin-top: 10px; color: var(--text-secondary); }
    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }
    input { 
        width: 100%; 
        padding: 10px; 
        padding-right: 40px;
        margin-top: 5px; 
        box-sizing: border-box;
        /* Standard Neutral Look */
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-primary);
        border: 1px solid rgba(255, 255, 255, 0.2); 
        border-radius: 4px;
        outline: none;
    }
    input:focus {
        border-color: #3b82f6;
        background: rgba(255, 255, 255, 0.1);
    }
    input::placeholder {
        color: var(--placeholder-color);
    }
    .toggle-password {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-primary);
        cursor: pointer;
        padding: 0;
        width: auto;
        margin: 0;
        font-size: 15px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .toggle-password:hover {
        color: var(--border-primary);
        background: none;
    }
    button { 
        margin-top: 20px; 
        padding: 10px; 
        width: 100%;
        background-color: #3b82f6; /* Blue */
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    button[type="submit"]:hover {
        background-color: #2563eb;
        transform: translateY(-1px);
    }

    /* New Error Box Style */
    .error-box {
        color: #ef4444;
        font-size: 13px;
        text-align: center;
        background: rgba(239, 68, 68, 0.1);
        padding: 10px;
        border-radius: 4px;
        border: 1px solid rgba(239, 68, 68, 0.2);
        margin-top: 10px;
        display: none; /* Hidden by default */
    }

    /* Light Theme Specific Overrides */
    body.light-theme input {
        background: rgba(0, 0, 0, 0.05);
        border: 1px solid rgba(0, 0, 0, 0.2);
        color: #1f2937;
    }
    
    body.light-theme input:focus {
        background: rgba(0, 0, 0, 0.08);
        border-color: #3b82f6;
    }

    body.light-theme input::placeholder {
        color: rgba(0, 0, 0, 0.4);
    }

    body.light-theme label {
        color: #4b5563;
    }

    body.light-theme .toggle-password {
        color: #4b5563;
    }

    body.light-theme .toggle-password:hover {
        color: #000;
    }
  </style>
</head>
<body>
  <script>
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const theme = urlParams.get('theme') || localStorage.getItem('theme');
        if (theme === 'light') {
            document.body.classList.add('light-theme');
        }
    })();

    // Listen for theme changes from parent
    window.addEventListener('message', (event) => {
        if (event.data.type === 'THEME_CHANGE') {
            if (event.data.theme === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
        }
    });
  </script>
  <h1>Sign Up</h1>
  <form id="registerForm">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required />

    <label for="password">Password</label>
    <div class="input-wrapper">
      <input type="password" id="password" name="password" required />
      <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path class="eye-closed" d="M12 7C14.76 7 17 9.24 17 12C17 12.65 16.87 13.26 16.64 13.83L19.56 16.75C21.07 15.49 22.26 13.86 22.99 12C21.26 7.61 16.99 4.5 11.99 4.5C10.59 4.5 9.25 4.75 8.01 5.2L10.17 7.36C10.74 7.13 11.35 7 12 7ZM2 4.27L4.28 6.55L4.74 7.01C3.08 8.3 1.78 10.02 1 12C2.73 16.39 7 19.5 12 19.5C13.55 19.5 15.03 19.2 16.38 18.66L16.8 19.08L19.73 22L21 20.73L3.27 3M7.53 9.8L9.08 11.35C9.03 11.56 9 11.78 9 12C9 13.66 10.34 15 12 15C12.22 15 12.44 14.97 12.65 14.92L14.2 16.47C13.53 16.8 12.79 17 12 17C9.24 17 7 14.76 7 12C7 11.21 7.2 10.47 7.53 9.8ZM11.84 9.02L14.99 12.17L15.01 11.99C15.01 10.33 13.67 8.99 12.01 8.99L11.84 9.02Z" fill="currentColor"/>
          <path class="eye-open" d="M12 5C7 5 2.73 8.11 1 12.5C2.73 16.89 7 20 12 20C17 20 21.27 16.89 23 12.5C21.27 8.11 17 5 12 5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z" fill="currentColor" style="display: none;"/>
        </svg>
      </button>
    </div>

    <label for="confirmPassword">Confirm Password</label>
    <div class="input-wrapper">
      <input type="password" id="confirmPassword" name="confirmPassword" required />
      <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Toggle confirm password visibility">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path class="eye-closed" d="M12 7C14.76 7 17 9.24 17 12C17 12.65 16.87 13.26 16.64 13.83L19.56 16.75C21.07 15.49 22.26 13.86 22.99 12C21.26 7.61 16.99 4.5 11.99 4.5C10.59 4.5 9.25 4.75 8.01 5.2L10.17 7.36C10.74 7.13 11.35 7 12 7ZM2 4.27L4.28 6.55L4.74 7.01C3.08 8.3 1.78 10.02 1 12C2.73 16.39 7 19.5 12 19.5C13.55 19.5 15.03 19.2 16.38 18.66L16.8 19.08L19.73 22L21 20.73L3.27 3M7.53 9.8L9.08 11.35C9.03 11.56 9 11.78 9 12C9 13.66 10.34 15 12 15C12.22 15 12.44 14.97 12.65 14.92L14.2 16.47C13.53 16.8 12.79 17 12 17C9.24 17 7 14.76 7 12C7 11.21 7.2 10.47 7.53 9.8ZM11.84 9.02L14.99 12.17L15.01 11.99C15.01 10.33 13.67 8.99 12.01 8.99L11.84 9.02Z" fill="currentColor"/>
          <path class="eye-open" d="M12 5C7 5 2.73 8.11 1 12.5C2.73 16.89 7 20 12 20C17 20 21.27 16.89 23 12.5C21.27 8.11 17 5 12 5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z" fill="currentColor" style="display: none;"/>
        </svg>
      </button>
    </div>

    <button type="submit">Register</button>
  </form>

  <div id="error"></div>
  <div id="success"></div>

  <script>
    // Listen for theme changes from parent
    window.addEventListener('message', (event) => {
        if (event.data.type === 'THEME_CHANGE') {
            if (event.data.theme === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
        }
    });
  </script>
  <script type="module" src="/register.ts"></script>
</body>
</html>
